spring:
  application:
    name: parser
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:${OPENAI_BASE_URL:https://integrate.api.nvidia.com}}
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      chat:
        options:
          model: ${OPENAI_MODEL:nvidia/nemotron-3-super-120b-a12b}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/log_analyzer}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.jdbc.time_zone: UTC
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  jackson:
    time-zone: UTC
  config:
    import: optional:file:./secret.yaml, optional:dotenv:.
#  kafka:
#    bootstrap-servers: localhost:9092
#    consumer:
#      group-id: log-consumer-group
#      auto-offset-reset: latest
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      batch-listener: true
#      common-error-handler: true
#      max-poll-records: 50

storage:
  type: s3
  key-prefix: logs
  max-object-size-bytes: 104857600
  presigned-url-ttl-minutes: 15

  # S3
  bucket: ${AWS_STORAGE_BUCKET}
  region: us-east-1
  endpoint: ""
  path-style-access: false
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}

  # Local
  local-base-dir: uploads
  local-base-url: http://localhost:8081

server:
  port: 8081

log:
  format:
    java:
      spring-boot: '^(?<timestamp>\S+)\s+(?<level>\w+)\s+(?<pid>\d+)\s+---\s+\[(?<context>.*?)\]\s+\[(?<thread>.*?)\]\s+(?<className>\S+)\s+:\s+(?<message>.*)$'
      log4j: '^(?<timestamp>\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}[,\.]\d+)\s+\[(?<thread>.*?)\]\s+(?<level>\w+)\s+(?<className>[\w\.$]+)\s+-\s+(?<message>.*)$'
      simple-java: '^(?<timestamp>\w+\s+\d{1,2},\s+\d{4}\s+\d{1,2}:\d{2}:\d{2}\s+[AP]M)\s+(?<className>[\w\.]+)\s+(?<method>\w+)\n(?<level>\w+):\s+(?<message>.*)$'
# application.yml
#logging:
#  level:
#    tracer: TRACE
#    org.springframework.data.elasticsearch.client: TRACE
#    org.springframework.web.client.RestClient: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

openai:
  api-key: ${OPENAI_API_KEY}

claude:
  api-key: ${CLAUDE_API_KEY}
