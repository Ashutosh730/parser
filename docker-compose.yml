version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: log-analyzer-postgres
    environment:
      POSTGRES_DB: log_analyzer
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: log-analyzer-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false    # disable auth for local dev
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  # limit memory
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: log-analyzer-app
    ports:
      - "8081:8081"
    environment:
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/log_analyzer
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin

      # Elasticsearch
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

      # LLM API keys
      SPRING_AI_OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - log_uploads:/app/uploads   # persists uploaded log files

volumes:
  postgres_data:
  elasticsearch_data:
  log_uploads: